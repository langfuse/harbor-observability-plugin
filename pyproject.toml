[project]
name = "harbor-langfuse"
version = "0.1.0"
description = "Harbor plugin that sends agent evaluation jobs to Langfuse as experiment runs, with trajectories as traces and verifier rewards as scores."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "harbor>=0.26",
    "harbor-atif2otel>=0.1.1",
    "opentelemetry-proto>=1.20",
]

[project.entry-points."harbor.plugins"]
langfuse = "harbor_langfuse.plugin:LangfusePlugin"

[project.scripts]
harbor-langfuse = "harbor_langfuse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_langfuse"]
